name: docs-audit
# 12 hops is the default; two full pushback rounds need more than one.
max_hops: 16
# An audit turn reads a lot of files: 5 minutes has been enough so far, with room.
turn_timeout_ms: 600000
# This room runs in a linked worktree, which the guard leaves alone — so `refuse`
# is safe here and it exercises the documented workflow under the strictest setting.
launch_guard: refuse
definition_of_done: |
  docs/DOCS-AUDIT.md exists in the room's worktree and lists every tracked .md file in the
  repo (docs/, prompts/, README.md, AGENTS.md) with a verdict of current, stale or
  historical. Every "stale" row names the claim, the code file:line (or commit) that
  contradicts it, and the correction. The reviewer has verified at least three findings
  end to end and given an explicit go, and the lead has re-checked the cited lines itself.
task: |
  Audit this repo's documentation against the code, which is the source of truth, and
  produce docs/DOCS-AUDIT.md.

  Dispatch @dev1 first with the method and the deliverable shape. When @dev1 reports, send
  the findings to @reviewer for independent verification. If @reviewer pushes back, send it
  back to @dev1 with the specific claims; repeat until @reviewer gives a go. Check the
  cited lines yourself before you accept a verdict, and reply DONE only after @reviewer has
  given one.
lead:
  id: lead
  handle: "@lead"
  role: "Lead coordinator: dispatch, verify what comes back against the code, integrate. Never author the audit yourself."
  system_prompt_file: ../prompts/docs-audit-lead.md
  provider: commandcode
  model: deepseek/deepseek-v4-pro
  thinking: medium
  tools: [read, grep, bash]
agents:
  - id: dev1
    handle: "@dev1"
    role: "Audit the docs against the code and write docs/DOCS-AUDIT.md."
    system_prompt_file: ../prompts/docs-audit-dev.md
    provider: commandcode
    model: deepseek/deepseek-v4.1-flash
    thinking: high
    tools: [read, grep, bash, write, edit]
  - id: reviewer
    handle: "@reviewer"
    role: "Independently verify the audit's claims against the code. Do not edit files."
    system_prompt_file: ../prompts/docs-audit-reviewer.md
    provider: commandcode
    model: gpt-5.6-luna
    thinking: high
    tools: [read, grep, bash]
