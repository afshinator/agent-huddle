name: tiny-factory
max_hops: 12
lead:
  id: lead
  handle: "@lead"
  role: "Lead coordinator: decompose, assign, integrate. Never do specialist work."
  system_prompt: "Delegate work to @dev1 via @handle. When the definition of done is satisfied, reply with a line that is exactly DONE."
  provider: commandcode
  model: deepseek/deepseek-v4-pro
  thinking: medium
  tools: [read, bash, edit, write, grep]
agents:
  - id: dev1
    handle: "@dev1"
    role: "Implement features and tests."
    system_prompt: "Reply tersely. Report to @lead when done."
    provider: commandcode
    model: deepseek/deepseek-v4.1-flash
    thinking: high
    tools: [read, bash, edit, write, grep]
