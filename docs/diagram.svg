<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#0b1220"/>
  <text x="24" y="42" font-size="22" font-weight="700" fill="#e2e8f0">v1 Config-Driven Multi-Agent Chat Room</text>
  <text x="24" y="64" font-size="13" fill="#94a3b8">pi --mode rpc sessions · herdr panes · single room log · mention-gated lead routing</text>

  <!-- ============ Supervisor ============ -->
  <rect x="24" y="96" width="220" height="116" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <text x="134" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#f472b6">supervisor</text>
  <text x="134" y="148" text-anchor="middle" font-size="11.5" fill="#cbd5e1">human · types in the</text>
  <text x="134" y="164" text-anchor="middle" font-size="11.5" fill="#cbd5e1">supervisor herdr pane</text>
  <text x="134" y="184" text-anchor="middle" font-size="10.5" fill="#94a3b8">@agent → direct · else → lead</text>

  <!-- ============ Coordinator ============ -->
  <rect x="320" y="80" width="460" height="470" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="340" y="112" font-size="16" font-weight="700" fill="#38bdf8">Coordinator (TypeScript)</text>

  <!-- Router -->
  <rect x="344" y="130" width="196" height="84" rx="8" fill="#334155" stroke="#38bdf8"/>
  <text x="442" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">Router</text>
  <text x="442" y="180" text-anchor="middle" font-size="11" fill="#cbd5e1">@mention parse</text>
  <text x="442" y="196" text-anchor="middle" font-size="11" fill="#cbd5e1">lead = default</text>

  <!-- TurnLoop -->
  <rect x="344" y="230" width="196" height="84" rx="8" fill="#334155" stroke="#38bdf8"/>
  <text x="442" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">TurnLoop</text>
  <text x="442" y="280" text-anchor="middle" font-size="11" fill="#cbd5e1">hop cap · nudge</text>
  <text x="442" y="296" text-anchor="middle" font-size="11" fill="#cbd5e1">DONE signal</text>

  <!-- data stores -->
  <rect x="568" y="130" width="188" height="64" rx="8" fill="#3a2c0e" stroke="#fbbf24"/>
  <text x="662" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">config.yaml</text>
  <text x="662" y="178" text-anchor="middle" font-size="11" fill="#cbd5e1">room · lead · agents</text>

  <rect x="568" y="214" width="188" height="64" rx="8" fill="#3a2c0e" stroke="#fbbf24"/>
  <text x="662" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">messages.jsonl</text>
  <text x="662" y="262" text-anchor="middle" font-size="11" fill="#cbd5e1">room log (append)</text>

  <rect x="568" y="298" width="188" height="64" rx="8" fill="#3a2c0e" stroke="#fbbf24"/>
  <text x="662" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">state.json</text>
  <text x="662" y="346" text-anchor="middle" font-size="11" fill="#cbd5e1">live room state</text>

  <text x="344" y="522" font-size="12" fill="#94a3b8">owns pi children · owns room log</text>
  <text x="344" y="540" font-size="12" fill="#94a3b8">single source of truth: messages.jsonl + state.json</text>

  <!-- ============ herdr panes ============ -->
  <rect x="900" y="96" width="356" height="250" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="920" y="124" font-size="15" font-weight="700" fill="#a78bfa">herdr panes</text>

  <rect x="920" y="140" width="316" height="44" rx="8" fill="#2d1b4e" stroke="#a78bfa"/>
  <text x="1078" y="166" text-anchor="middle" font-size="12" fill="#e2e8f0">room stream — tail messages.jsonl</text>

  <rect x="920" y="192" width="316" height="44" rx="8" fill="#2d1b4e" stroke="#a78bfa"/>
  <text x="1078" y="218" text-anchor="middle" font-size="12" fill="#e2e8f0">supervisor — input + log</text>

  <rect x="920" y="244" width="316" height="44" rx="8" fill="#2d1b4e" stroke="#a78bfa"/>
  <text x="1078" y="270" text-anchor="middle" font-size="12" fill="#e2e8f0">per-agent — tail agent logs</text>

  <text x="920" y="312" font-size="11" fill="#94a3b8">collapse/close never stops pi</text>
  <text x="920" y="328" font-size="11" fill="#94a3b8">panes tail logs only</text>

  <!-- ============ pi sessions ============ -->
  <rect x="900" y="380" width="356" height="300" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="920" y="408" font-size="15" font-weight="700" fill="#34d399">pi --mode rpc sessions</text>

  <rect x="920" y="424" width="316" height="52" rx="8" fill="#052e1b" stroke="#34d399"/>
  <text x="938" y="448" font-size="12.5" font-weight="700" fill="#e2e8f0">@lead</text>
  <text x="938" y="466" font-size="10.5" fill="#94a3b8">--session-dir agents/lead</text>

  <rect x="920" y="488" width="316" height="52" rx="8" fill="#052e1b" stroke="#34d399"/>
  <text x="938" y="512" font-size="12.5" font-weight="700" fill="#e2e8f0">@researcher</text>
  <text x="938" y="530" font-size="10.5" fill="#94a3b8">--session-dir agents/researcher</text>

  <rect x="920" y="552" width="316" height="52" rx="8" fill="#052e1b" stroke="#34d399"/>
  <text x="938" y="576" font-size="12.5" font-weight="700" fill="#e2e8f0">@implementer</text>
  <text x="938" y="594" font-size="10.5" fill="#94a3b8">--session-dir agents/implementer</text>

  <text x="920" y="632" font-size="11" fill="#94a3b8">one persistent session per agent</text>
  <text x="920" y="648" font-size="11" fill="#94a3b8">isolated role/context continuity</text>

  <!-- ============ arrows ============ -->

  <!-- supervisor -> coordinator -->
  <line x1="244" y1="150" x2="318" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="281" y="140" text-anchor="middle" font-size="10" fill="#94a3b8">messages</text>

  <!-- Router -> TurnLoop -->
  <line x1="442" y1="214" x2="442" y2="228" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- config.yaml -> Router -->
  <line x1="566" y1="162" x2="542" y2="162" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- TurnLoop <-> stores -->
  <line x1="542" y1="246" x2="566" y2="246" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="542" y1="330" x2="566" y2="330" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="554" y="238" text-anchor="middle" font-size="9.5" fill="#94a3b8">r/w</text>
  <text x="554" y="322" text-anchor="middle" font-size="9.5" fill="#94a3b8">r/w</text>

  <!-- Coordinator -> herdr panes -->
  <line x1="780" y1="235" x2="898" y2="235" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="839" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#38bdf8">HerdrPaneManager</text>
  <text x="839" y="226" text-anchor="middle" font-size="10" fill="#94a3b8">(seam)</text>
  <text x="839" y="252" text-anchor="middle" font-size="10" fill="#94a3b8">pane ops</text>

  <!-- Coordinator -> pi sessions -->
  <line x1="780" y1="520" x2="898" y2="520" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="839" y="497" text-anchor="middle" font-size="10.5" font-weight="700" fill="#38bdf8">PiAgentClient</text>
  <text x="839" y="511" text-anchor="middle" font-size="10" fill="#94a3b8">(seam)</text>
  <text x="839" y="537" text-anchor="middle" font-size="10" fill="#94a3b8">prompt · push</text>

  <!-- pi sessions -> Coordinator (stream) -->
  <line x1="898" y1="580" x2="782" y2="580" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrD)"/>
  <text x="839" y="572" text-anchor="middle" font-size="10" fill="#64748b">stream · settle</text>

  <!-- ============ legend ============ -->
  <line x1="24" y1="724" x2="64" y2="724" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="72" y="728" font-size="11" fill="#94a3b8">solid = dispatch / control</text>
  <line x1="200" y1="724" x2="240" y2="724" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="248" y="728" font-size="11" fill="#64748b">dashed = stream / settle</text>
</svg>
